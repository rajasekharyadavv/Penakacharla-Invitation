<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajeswari & Arvind | Wedding Invitation</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:#fffaf4;color:#4b3027}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 18px;background:radial-gradient(circle at top,#fff0d8,#fffaf4 55%,#f8e8dc)}
.card{max-width:760px;width:100%;padding:55px 25px;border:1px solid #d9b99d;border-radius:24px;background:rgba(255,255,255,.75);box-shadow:0 15px 50px rgba(91,58,39,.12)}
.small{letter-spacing:4px;text-transform:uppercase;font-size:13px}
h1{font-size:clamp(48px,10vw,82px);font-weight:normal;margin:18px 0 8px;color:#7a3f35}
.amp{font-size:38px;color:#b27a4b}
.date{font-size:21px;margin:25px 0}
.divider{width:90px;height:1px;background:#b27a4b;margin:25px auto}
.section{padding:18px 0}
h2{font-weight:normal;color:#7a3f35}
.info{font-family:Arial,sans-serif;font-size:16px;line-height:1.8}
.footer{margin-top:30px;font-style:italic}
@media(max-width:500px){.card{padding:42px 18px}h1{font-size:48px}}
</style>
</head>
<body>
<section class="hero">
  <div class="card">
    <div class="small">Together with their families</div>
    <h1>Rajeswari</h1>
    <div class="amp">&amp;</div>
    <h1>Arvind</h1>
    <div class="divider"></div>
    <div class="date">23 August 2026 · 10:15 AM – 11:15 AM</div>

    <div class="section">
      <h2>Wedding Ceremony</h2>
      <div class="info">23 August 2026<br>10:15 AM – 11:15 AM</div>
    </div>

    <div class="section">
      <h2>Reception</h2>
      <div class="info">22 August 2026<br>7:30 PM onwards</div>
    </div>

    <div class="section">
      <h2>Venue</h2>
      <div class="info">Venue details</div>
    </div>

    <div class="divider"></div>
    <div class="footer">We warmly invite you to celebrate this special day with us.</div>
  </div>
</section>
</body>
</html>
